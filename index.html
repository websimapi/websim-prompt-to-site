<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt-to-Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden select-none font-inter">

    <!-- Main Viewport (Preview) -->
    <div id="preview-container" class="absolute inset-0 z-0 bg-white transition-opacity duration-300">
        <iframe id="site-preview" class="w-full h-full border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        
        <!-- Empty State / Welcome -->
        <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-800 bg-gray-50 p-6 text-center z-10">
            <div class="mb-8 p-4 bg-white rounded-2xl shadow-xl animate-float">
                <i class="fa-solid fa-wand-magic-sparkles text-4xl text-purple-600 mb-4"></i>
                <h1 class="text-2xl font-bold mb-2">Prompt-to-Site</h1>
                <p class="text-gray-500 text-sm">Describe it. Build it.</p>
            </div>
            <div class="space-y-4 max-w-md w-full">
                <p class="text-gray-600">Try saying...</p>
                <button class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A personal portfolio for a photographer with a dark theme and masonry gallery">
                    "A photographer's portfolio with dark mode"
                </button>
                <button class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A retro 80s synthwave landing page with neon text effects">
                    "Retro 80s synthwave landing page"
                </button>
                <button class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A simple interactive calculator app with pastel colors">
                    "Pastel interactive calculator"
                </button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center">
            <div class="loader mb-4"></div>
            <p id="loading-text" class="text-white font-mono text-sm animate-pulse">Generating code...</p>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none z-20 flex flex-col justify-end">
        
        <!-- Bottom Container (Wraps History + Input) -->
        <div id="bottom-bar-container" class="pointer-events-auto p-4 w-full max-w-4xl mx-auto transition-all duration-300 flex flex-col justify-end gap-3">
            
            <!-- Version History Panel (Now above input) -->
            <div id="history-panel" class="bg-gray-900/95 backdrop-blur-xl border border-gray-700 rounded-2xl shadow-2xl transform opacity-0 translate-y-4 scale-95 pointer-events-none transition-all duration-300 max-h-[40vh] flex flex-col origin-bottom">
                <div class="px-4 py-3 flex justify-between items-center border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-code-branch text-blue-400 text-xs"></i>
                        <h2 class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Project Timeline</h2>
                    </div>
                    <button id="close-history" class="text-gray-500 hover:text-white transition-colors w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/10"><i class="fa-solid fa-times text-xs"></i></button>
                </div>
                <div id="history-list" class="overflow-y-auto p-2 space-y-2 flex-1 custom-scrollbar">
                    <!-- History items injected here -->
                </div>
            </div>

            <!-- Main Input Bar -->
            <div class="bg-gray-800/90 backdrop-blur-lg border border-gray-700 rounded-2xl shadow-2xl p-2 flex items-end gap-2 relative overflow-hidden ring-1 ring-white/10 z-10">
                
                <!-- Utilities (Left) -->
                <div class="flex flex-col gap-1 pb-1">
                    <button id="btn-history" class="w-10 h-10 rounded-xl hover:bg-gray-700 text-gray-400 hover:text-white transition-colors flex items-center justify-center relative">
                        <i class="fa-solid fa-code-branch"></i>
                        <span id="version-badge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-blue-500 rounded-full hidden"></span>
                    </button>
                    <button id="btn-random" class="w-10 h-10 rounded-xl hover:bg-gray-700 text-gray-400 hover:text-purple-400 transition-colors flex items-center justify-center">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>

                <!-- Input Area -->
                <div class="flex-1 bg-gray-900/50 rounded-xl border border-gray-700/50 min-h-[48px] flex items-center relative transition-all focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:bg-gray-900">
                    <textarea id="prompt-input" rows="1" placeholder="Describe your website..." class="w-full bg-transparent text-white placeholder-gray-500 text-sm p-3 pr-10 focus:outline-none resize-none overflow-hidden max-h-32 font-inter leading-relaxed"></textarea>
                    
                    <!-- Voice Input Button (Inside Input) -->
                    <button id="btn-mic" class="absolute right-2 bottom-2 w-8 h-8 rounded-full hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>

                <!-- Action Button (Right) -->
                <button id="btn-send" class="w-12 h-12 rounded-xl bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20 flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed pb-0.5">
                    <i class="fa-solid fa-paper-plane text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-xl text-sm opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2 border border-gray-700">
        <i class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script type="module" src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
